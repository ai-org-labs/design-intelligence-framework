{
  "version": "0.1",
  "product": {
    "id": "dif",
    "name": "Design Intelligence Framework",
    "purpose": "Help people compare evidence-aware design proposals",
    "primary_users": [
      "Designers",
      "Product teams"
    ],
    "user_value": "Understand options, tradeoffs and unverified assumptions before adoption",
    "scope": [
      "Skills-first registration/login UX/UI proposals",
      "Optional validation CLI",
      "Architecture and quality provenance"
    ],
    "out_of_scope": [
      "Authentication service",
      "Automatic human approval",
      "Unverified stable publication"
    ],
    "capabilities": [
      {
        "id": "propose",
        "name": "Compare design alternatives",
        "purpose": "Compare design alternatives",
        "actor": [
          "Designer",
          "Reviewer"
        ],
        "inputs": [
          "Design request or versioned design package"
        ],
        "outputs": [
          "Reviewable artifacts and explicit uncertainty"
        ],
        "behaviors": [
          {
            "id": "propose-behavior",
            "name": "Compare design alternatives",
            "trigger": "Designer requests propose",
            "outcomes": [
              "Contract and references are packaged"
            ],
            "failure_behaviors": [
              "Report incomplete/unverified work; do not fabricate evidence"
            ],
            "realized_by": [
              "skills"
            ],
            "scenarios": [
              {
                "id": "propose-scenario",
                "name": "Contract and references are packaged",
                "type": "gherkin",
                "specification": "Given a design request with explicit constraints\nWhen the designer runs propose\nThen contract and references are packaged",
                "verified_by": [
                  "skill-contract"
                ]
              }
            ]
          },
          {
            "id": "visual-proposal-behavior",
            "name": "Translate meaning into visual directions",
            "trigger": "User requests visual proposals or stronger visual appeal",
            "outcomes": [
              "Comparable screen proposals and a reasoned refinement with explicit limits"
            ],
            "failure_behaviors": [
              "Report unavailable imagery and unobserved references without fabricated proof"
            ],
            "realized_by": [
              "art-direction"
            ],
            "scenarios": [
              {
                "id": "visual-proposal-scenario",
                "name": "Compare and refine visual directions",
                "type": "gherkin",
                "specification": "Given a brand brief and shared content\nWhen visual directions are requested\nThen produce comparable screens, critique and a revised proposal with adoption pending",
                "verified_by": [
                  "visual-trials"
                ]
              }
            ]
          },
          {
            "id": "controls-behavior",
            "name": "Design precise controls and recoverable states",
            "trigger": "User requests settings or form design",
            "outcomes": [
              "Concrete control/state proposals with scoped platform guidance"
            ],
            "failure_behaviors": [
              "Report missing runtime evidence and preserve unknown native outcomes"
            ],
            "realized_by": [
              "controls"
            ],
            "scenarios": [
              {
                "id": "controls-scenario",
                "name": "Separate preview, persistence and recovery",
                "type": "gherkin",
                "specification": "Given settings with precise and immediate controls\nWhen detailed UI is requested\nThen explain control choice, platform, preview, save and failed-state recovery",
                "verified_by": [
                  "controls-trials"
                ]
              }
            ]
          }
        ],

  "decisions": [
    {
      "id": "skills-first",
      "name": "Skills first; CLI optional",
      "context": "Users need text proposals without installing a toolchain",
      "decision": "Package portable Skills independently of deterministic CLI helpers",
      "alternatives": [
        "CLI-only generator",
        "Hosted model service"
      ],
      "reason": "Supports standalone use and avoids provider coupling",
      "trade_off": [
        "Host behavior still requires compatibility testing"
      ],
      "decision_status": "proposed",
      "affects": [
        "dif",
        "skills",
        "validator"
      ]
    },
    {
      "id": "semantic-model",
      "name": "Archmodel source and ArchMap projection",
      "context": "Design rationale must survive diagram edits",
      "decision": "Store canonical architecture as archmodel and regenerate Mermaid/SVG projections",
      "alternatives": [
        "Manually maintained disconnected diagrams"
      ],
      "reason": "Keeps stable IDs and causal traceability",
      "trade_off": [
        "Regeneration needs optional upstream tools"
      ],
      "decision_status": "proposed",
      "affects": [
        "dif",
        "projection"
      ]
    }
  ],

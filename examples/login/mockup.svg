<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">DIF registration and login alternatives</title><desc id="desc">Two design candidates with registration, login, recovery and success. Static proposal, untested behavior.</desc>
<rect width="1600" height="1160" fill="#EEF2F7"/>
<text x="48" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18283B">DIF / Access, with a way back</text>
<text x="48" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#506078">REGISTRATION + LOGIN     /     TWO ALTERNATIVES     /     REVISION 02</text>
<text x="48" y="150" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18283B">A  /  Familiar form</text>
<text x="48" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506078">Separate registration and sign-in</text>

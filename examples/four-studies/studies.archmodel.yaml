  "decisions": [
    {
      "id": "menu-direction",
      "name": "Casa Tutti menu direction",
      "context": "User clarified a physical tabletop menu and rejected the promotional Web delivery",
      "decision": "Fixed A4 front/back menu with food imagery, order numbers and visible prices",
      "alternatives": [
        "Rejected: category-filtered restaurant promotional webpage"
      ],
      "reason": "Deliver the object used at a restaurant table",
      "trade_off": [
        "Authored demonstration, not independent user or hardware evidence"
      ],
      "decision_status": "proposed",
      "affects": [
        "menu-ui"
      ]
    },
    {
      "id": "device-direction",
      "name": "AER device homepage direction",
      "context": "Explain a fictional device through form and purpose without invented specifications",
      "decision": "Quiet product-led composition with original vector hardware",
      "alternatives": [
        "Technical specification-first homepage"
      ],
      "reason": "Make the primary task and its uncertainty visible",
      "trade_off": [
        "Authored demonstration, not independent user or hardware evidence"
      ],
      "decision_status": "proposed",
      "affects": [
        "device-ui"
      ]
    },
    {
      "id": "monster-direction",
      "name": "FIELDNOTE archive direction",
      "context": "User requested the contents of the device display",
      "decision": "Display-only 320x240 screens without an enclosing product webpage",
      "alternatives": [
        "Rejected as primary deliverable: framed device on a promotional page"
      ],
      "reason": "Expose the actual embedded UI instead of an introduction to it",
      "trade_off": [
        "Authored demonstration, not independent user or hardware evidence"
      ],
      "decision_status": "proposed",
      "affects": [
        "monster-ui"
      ]
    },
    {
      "id": "bank-direction",
      "name": "NAGI deposit flow direction",
      "context": "Keep login, expected funds, pending settlement and confirmed balance distinct",
      "decision": "External transfer instructions; confirmation requires a mock bank event",
      "alternatives": [
        "Connected-bank guided deposit requiring validated integrations"
      ],
      "reason": "Make the primary task and its uncertainty visible",
      "trade_off": [
        "Authored demonstration, not independent user or hardware evidence"
      ],
      "decision_status": "proposed",
      "affects": [
        "bank-ui"
      ]
    }
  ],
